name: SignLens
version: '${pluginVersion}'
main: io.github.la8garlic.signlens.SignLensPlugin
description: A lightweight, zero-client world text accessibility layer for Paper.
author: la8garlic
website: https://github.com/la8garlic/SignLens
api-version: '26.2'

commands:
  signlens:
    description: Inspect the current SignLens session and performance state.
    usage: /signlens debug

permissions:
  signlens.use:
    description: Use SignLens reading assistance.
    default: true
  signlens.command.debug:
    description: Inspect SignLens focus and performance state.
    default: op

name: SignLens
version: '0.1.0'
main: io.github.la8garlic.signlens.SignLensPlugin
description: A lightweight, zero-client world text accessibility layer for Paper.
author: la8garlic
website: https://github.com/la8garlic/SignLens
api-version: '26.2'

commands:
  signlens:
    description: Configure and inspect SignLens.
    usage: /signlens [toggle|reload|debug]

permissions:
  signlens.use:
    description: Use SignLens reading assistance.
    default: true
  signlens.command.toggle:
    description: Toggle SignLens for yourself.
    default: op
  signlens.command.reload:
    description: Reload SignLens configuration.
    default: op
  signlens.command.debug:
    description: Inspect SignLens focus and performance state.
    default: op
